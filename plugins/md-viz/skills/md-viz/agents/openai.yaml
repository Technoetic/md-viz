interface:
  display_name: "md-viz · Zero-Install GitHub README Visualizer"
  short_description: "외부 패키지 설치 없이 Python 표준 라이브러리와 GitHub 네이티브 문법만으로 README.md를 고자극 시각화하는 전용 플러그인."
  default_prompt: "$md-viz:md-viz 외부 설치 없이 이 저장소의 README.md를 GitHub 네이티브(Mermaid·MathJax·GeoJSON·알림 5종)와 번들 Python 표준 라이브러리 생성기(네온 배지·순수 SVG 차트 10종·GIF89a+PNG·정렬 트리)로 고자극 시각화하고 결과를 검증해 줘."
