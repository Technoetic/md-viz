<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>NEON ENCORE · 공연 데이터 시연</title>
<link href="vendor/leaflet.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101425;color:#e9edff;font:16px "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
article{width:868px;overflow:hidden;border:1px solid #33394f;background:#101425}
header{padding:21px 29px 12px;background:linear-gradient(120deg,#20233b,#101425 68%);border-top:4px solid var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;color:#aeb9d3;font:600 13px/1.3 Consolas,monospace;letter-spacing:.11em}
.top strong{color:var(--ac)}h1{font-size:32px;letter-spacing:-.055em;line-height:1.35;margin:10px 0 4px}
.frame{width:808px;height:280px;margin:8px auto 10px;position:relative;display:grid;place-items:center;overflow:hidden}
.frame>.surface{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0}.still{display:block;width:100%;height:100%;object-fit:contain}
#chart>svg{display:block}#chart canvas{max-width:100%;max-height:100%}.leaflet-container{background:#121a30}
.venue-label{white-space:nowrap;color:#e9edff;background:#1b2542;border:1px solid #596783;border-radius:4px;font-weight:bold;padding:3px 7px;font-size:15px;line-height:1.5;width:max-content!important;height:auto!important}
.coordinate{color:#8191b0;font:12px Consolas,monospace;white-space:nowrap}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 29px 15px;background:#141a2d;border-top:1px solid #2c334a}
footer p{margin:0;font-size:16px;letter-spacing:-.025em}small{flex-shrink:0;color:#aeb9d3;font-size:13px}
</style>
<article><header><div class="top"><span>NEON ENCORE &nbsp;/&nbsp; <strong id="category"></strong></span><span id="engine"></span></div><h1></h1></header>
<div class="frame"><div class="surface" id="chart"></div></div>
<footer><p id="insight"></p><small>시연용 예시</small></footer></article>
<script src="charts.js"></script>
</html>
