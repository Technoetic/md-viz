<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ENCORE · 세 가지 입력 다시 그리기</title>
<style>
  body { max-width: 52rem; margin: auto; padding: 1rem; font-family: system-ui, sans-serif }
  section { margin-block: 2rem }
  #stage { background: #14182c; padding: 1rem }
  #stage svg, #score svg { display: block; width: 100%; height: auto }
  #notes { display: block; width: 100%; height: 20rem }
</style>
<h1>NEON ENCORE</h1>
<section><h2>무대 배치 · Excalidraw</h2><div id="stage"></div></section>
<section><h2>리허설 노트 · markmap</h2><svg id="notes" aria-label="리허설 노트"></svg></section>
<section><h2>첫 멜로디 · abcjs</h2><div id="score"></div></section>
<p role="alert" id="error"></p>
<script src="./node_modules/react/umd/react.production.min.js"></script>
<script src="./node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script>window.EXCALIDRAW_ASSET_PATH = './node_modules/@excalidraw/excalidraw/dist/'</script>
<script src="./node_modules/@excalidraw/excalidraw/dist/excalidraw.production.min.js"></script>
<script src="./node_modules/d3/dist/d3.min.js"></script>
<script src="./node_modules/markmap-view/dist/browser/index.js"></script>
<script src="./node_modules/abcjs/dist/abcjs-basic-min.js"></script>
<script src="./stage-plot.js"></script>
<script>
  async function readFile(name) {
    const response = await fetch(name)
    if (!response.ok) throw new Error(name + ' 파일을 읽을 수 없습니다.')
    return response.text()
  }

  async function renderExamples() {
    const elements = ExcalidrawLib.convertToExcalidrawElements(encoreStage())
      .map((element, i) => ({ ...element, seed: 741 + i }))
    const stage = await ExcalidrawLib.exportToSvg({
      elements, appState: { exportBackground: false }, files: null, skipInliningFonts: true
    })
    document.querySelector('#stage').append(stage)

    const root = JSON.parse(await readFile('./set-notes.json'))
    markmap.Markmap.create(document.querySelector('#notes'), { duration: 0 }, root)

    const notation = await readFile('./encore.abc')
    ABCJS.renderAbc('score', notation, { responsive: 'resize', staffwidth: 720 })
  }

  renderExamples().catch(error => {
    document.querySelector('#error').textContent = error.message
  })
</script>
</html>
